version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
      - admin

  api:
    build: 
      context: ./api
      dockerfile: Dockerfile
    environment:
      - PORT=3000
    expose:
      - "3000"

  web:
    build: 
      context: ./web
      dockerfile: Dockerfile
    environment:
      - PORT=3001
      - NEXT_PUBLIC_API_URL=http://localhost/api/v1
    expose:
      - "3001"

  admin:
    build: 
      context: ./admin
      dockerfile: Dockerfile
    environment:
      - PORT=3002
    expose:
      - "3002"
